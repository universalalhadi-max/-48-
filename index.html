<style>
  :root{
    --primary:#1B5FAE; --primary-dark:#124480; --primary-light:#E8F0FB;
    --success:#1E7E45; --success-light:#E6F6EC;
    --danger:#C0392B; --danger-light:#FBEAE8;
    --bg:#F3F5F8; --surface:#FFFFFF;
    --text:#1F2430; --text-muted:#6B7280; --border:#E3E6EA;
    --radius:12px; --radius-sm:8px;
    --font:'Cairo','Segoe UI',Tahoma,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;display:flex;justify-content:center;-webkit-font-smoothing:antialiased;}
  button,input{font-family:inherit;}
  #app{width:100%;max-width:480px;background:var(--bg);min-height:100vh;position:relative;display:flex;flex-direction:column;}

  /* رأس الصفحة */
  .app-header{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;z-index:20;}
  .app-header h1{font-size:1.1rem;font-weight:700;}
  .app-header .subtitle{font-size:0.7rem;opacity:0.85;margin-top:2px;}
  .logout-btn{background:rgba(255,255,255,0.15);color:#fff;border:1px solid rgba(255,255,255,0.4);padding:6px 12px;border-radius:var(--radius-sm);font-size:0.78rem;cursor:pointer;white-space:nowrap;}

  .main-content{flex:1;padding:16px;padding-bottom:96px;overflow-y:auto;}

  /* شريط التنقل السفلي */
  .bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--surface);border-top:1px solid var(--border);display:flex;z-index:20;padding-bottom:env(safe-area-inset-bottom,0);box-shadow:0 -2px 10px rgba(0,0,0,.04);}
  .nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:9px 2px 7px;color:var(--text-muted);cursor:pointer;font-size:0.66rem;border-top:2px solid transparent;background:none;border-left:none;border-right:none;border-bottom:none;}
  .nav-item.active{color:var(--primary);border-top-color:var(--primary);font-weight:600;}
  .nav-item svg{width:21px;height:21px;}

  h2.section-title{font-size:1.05rem;font-weight:700;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:8px;}
  h2.section-title .count{font-size:0.72rem;font-weight:600;color:var(--text-muted);background:var(--primary-light);color:var(--primary);padding:2px 9px;border-radius:20px;}
  h3.sub-title{font-size:0.9rem;font-weight:700;margin:18px 0 10px;color:var(--text);}
  h3.sub-title:first-child{margin-top:0;}

  /* عناصر عامة */
  .card{background:var(--surface);border-radius:var(--radius);padding:14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.05);}
  .btn{background:var(--primary);color:#fff;border:none;padding:11px 18px;border-radius:var(--radius-sm);cursor:pointer;font-size:0.9rem;font-weight:600;font-family:inherit;transition:background .15s,transform .1s;}
  .btn:active{transform:scale(.98);}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .btn:not(:disabled):hover{background:var(--primary-dark);}
  .btn-block{width:100%;}
  .btn-outline{background:transparent;color:var(--primary);border:1.5px solid var(--primary);padding:9px 16px;border-radius:var(--radius-sm);cursor:pointer;font-size:0.85rem;font-weight:600;font-family:inherit;}
  .btn-outline:disabled{opacity:.45;cursor:not-allowed;}
  .btn-danger{background:transparent;color:var(--danger);border:1.5px solid var(--danger);padding:9px 16px;border-radius:var(--radius-sm);cursor:pointer;font-size:0.85rem;font-weight:600;font-family:inherit;}
  .btn-danger-solid{background:var(--danger);color:#fff;border:none;padding:11px 18px;border-radius:var(--radius-sm);cursor:pointer;font-size:0.9rem;font-weight:600;font-family:inherit;}
  .btn-success{background:var(--success);color:#fff;border:none;padding:11px 18px;border-radius:var(--radius-sm);cursor:pointer;font-size:0.9rem;font-weight:600;font-family:inherit;}
  .btn-sm{padding:6px 12px;font-size:0.76rem;border-radius:7px;}
  .btn-row{display:flex;gap:8px;flex-wrap:wrap;}

  .input{width:100%;padding:11px 12px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:0.92rem;margin-bottom:10px;font-family:inherit;background:var(--surface);color:var(--text);}
  .input:focus{outline:2px solid var(--primary);outline-offset:1px;border-color:var(--primary);}
  label.field-label{display:block;font-size:0.8rem;color:var(--text-muted);margin-bottom:6px;font-weight:600;}
  .error-text{color:var(--danger);font-size:0.8rem;margin:-4px 0 10px;display:none;}
  .hint-text{color:var(--text-muted);font-size:0.78rem;margin:-4px 0 10px;line-height:1.5;}

  .search-wrap{position:relative;margin-bottom:12px;}
  .search-wrap svg{position:absolute;top:50%;transform:translateY(-50%);right:12px;color:var(--text-muted);width:18px;height:18px;pointer-events:none;}
  .search-wrap .input{padding-right:38px;margin-bottom:0;}

  .list-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px;background:var(--surface);border-radius:var(--radius);margin-bottom:8px;box-shadow:0 1px 3px rgba(0,0,0,.05);cursor:pointer;}
  .list-item .name{font-weight:700;font-size:0.92rem;}
  .list-item .shop{color:var(--text-muted);font-size:0.76rem;margin-top:2px;}
  .list-item .actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;}
  .list-item .total-badge{font-size:0.72rem;font-weight:700;color:var(--success);background:var(--success-light);padding:3px 9px;border-radius:20px;white-space:nowrap;margin-top:4px;display:inline-block;}

  .badge{background:var(--primary-light);color:var(--primary);padding:4px 10px;border-radius:20px;font-size:0.75rem;font-weight:700;white-space:nowrap;}
  .empty{text-align:center;color:var(--text-muted);padding:34px 16px;font-size:0.88rem;line-height:1.7;}

  .stat-row{display:flex;gap:8px;margin-bottom:14px;}
  .stat-box{flex:1;background:var(--surface);border-radius:var(--radius);padding:12px 8px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.05);}
  .stat-box .stat-label{font-size:0.7rem;color:var(--text-muted);margin-bottom:5px;}
  .stat-box .stat-value{font-size:0.98rem;font-weight:700;color:var(--primary);}

  .total-box{background:var(--success-light);color:var(--success);padding:13px;border-radius:var(--radius);text-align:center;font-weight:700;margin-top:6px;font-size:0.95rem;}

  .selected-tenant-card{background:var(--primary-light);border-radius:var(--radius);padding:13px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .selected-tenant-card .name{font-weight:700;color:var(--primary-dark);}
  .selected-tenant-card .shop{font-size:0.78rem;color:var(--text-muted);margin-top:2px;}

  .modal{position:fixed;inset:0;background:rgba(15,20,30,.55);display:flex;justify-content:center;align-items:flex-end;z-index:100;}
  .modal-content{background:var(--surface);border-radius:18px 18px 0 0;padding:20px;width:100%;max-width:480px;max-height:88vh;overflow-y:auto;animation:slideUp .18s ease-out;}
  @media(min-width:520px){.modal{align-items:center;}.modal-content{border-radius:18px;max-width:420px;}}
  @keyframes slideUp{from{transform:translateY(24px);opacity:.4;}to{transform:translateY(0);opacity:1;}}
  .modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
  .modal-header h3{font-size:1.02rem;font-weight:700;}
  .modal-close{background:none;border:none;font-size:1.4rem;line-height:1;color:var(--text-muted);cursor:pointer;padding:4px 8px;}
  .modal-actions{display:flex;gap:8px;margin-top:16px;justify-content:flex-end;}

  .receipt-preview{background:var(--bg);border:1.5px dashed var(--border);border-radius:var(--radius-sm);padding:14px;margin-bottom:14px;font-size:0.86rem;line-height:2;}
  .receipt-preview .r-row{display:flex;justify-content:space-between;}
  .receipt-preview .r-row span:first-child{color:var(--text-muted);}
  .receipt-preview .r-row span:last-child{font-weight:700;}

  .login-screen{display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:100vh;padding:24px;width:100%;}
  .login-box{width:100%;max-width:360px;background:var(--surface);padding:32px 22px;border-radius:20px;box-shadow:0 8px 30px rgba(20,40,80,.12);}
  .login-logo{width:60px;height:60px;background:var(--primary);border-radius:16px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:1.3rem;margin:0 auto 16px;}
  .login-box h2{text-align:center;margin-bottom:6px;color:var(--text);font-size:1.15rem;}
  .login-box .login-sub{text-align:center;margin-bottom:22px;color:var(--text-muted);font-size:0.85rem;}
  .login-note{margin-top:18px;font-size:0.76rem;color:var(--text-muted);text-align:center;line-height:1.6;}

  .role-tag{font-size:0.68rem;font-weight:700;padding:2px 9px;border-radius:20px;background:var(--primary-light);color:var(--primary);}
  .settings-row{display:flex;justify-content:space-between;align-items:center;background:var(--bg);padding:10px 12px;border-radius:var(--radius-sm);margin-bottom:8px;font-size:0.85rem;}
  .divider{height:1px;background:var(--border);margin:20px 0;border:none;}
  .danger-zone{border:1.5px solid var(--danger-light);background:var(--danger-light);border-radius:var(--radius);padding:14px;}
  .danger-zone p{font-size:0.8rem;color:#8a2c22;margin-bottom:12px;line-height:1.6;}

  .toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%) translateY(10px);background:rgba(25,28,36,.94);color:#fff;padding:10px 18px;border-radius:24px;font-size:0.82rem;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:300;max-width:88%;text-align:center;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .mini-history{margin-top:10px;}
  .mini-history .mh-row{display:flex;justify-content:space-between;font-size:0.78rem;padding:6px 0;border-bottom:1px solid var(--border);color:var(--text-muted);}
  .mini-history .mh-row span:last-child{color:var(--text);font-weight:600;}

  a{color:inherit;}
  ::selection{background:var(--primary-light);}

  /* لمسات بصرية إضافية */
  body{background:radial-gradient(circle at 50% -10%, #eaf1fb 0%, var(--bg) 45%);}
  .nav-item.active{background:var(--primary-light);}
  .stat-box{border-right:3px solid var(--primary);}
  .stat-box:nth-child(2){border-right-color:var(--success);}
  .stat-box:nth-child(3){border-right-color:var(--text-muted);}

  .header-actions{display:flex;gap:6px;}

  .btn-xs{padding:4px 9px;font-size:0.68rem;border-radius:6px;background:transparent;cursor:pointer;font-family:inherit;font-weight:600;}
  .mh-row-full{border-bottom:1px solid var(--border);padding-bottom:8px;margin-bottom:8px;}
  .mh-row-full:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0;}
  .mh-actions{display:flex;gap:6px;margin-top:5px;justify-content:flex-end;}

  .audit-row{background:var(--bg);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:8px;font-size:0.78rem;}
  .audit-top{display:flex;justify-content:space-between;gap:8px;font-weight:700;margin-bottom:3px;}
  .audit-mid{color:var(--text);margin-bottom:3px;}
  .audit-bottom{color:var(--text-muted);}

  select.input{cursor:pointer;}

  .checkbox-row{display:flex;align-items:flex-start;gap:8px;font-size:0.85rem;color:var(--text);margin-bottom:12px;line-height:1.5;cursor:pointer;}
  .checkbox-row input{margin-top:3px;width:17px;height:17px;flex-shrink:0;accent-color:var(--primary);cursor:pointer;}

  .print-only{display:none;}
  @media print{
    body{background:#fff;}
    body *{visibility:hidden;}
    #report-print-area, #report-print-area *{visibility:visible;}
    #report-print-area{position:absolute;top:0;left:0;right:0;padding:12px;}
    .print-only{display:block !important;margin-bottom:14px;}
    .print-only h2{font-size:1.15rem;margin-bottom:6px;}
    .print-only div{font-size:0.85rem;color:#333;margin-bottom:2px;}
    .list-item{box-shadow:none;border:1px solid #ddd;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  }
</style>

// إزالة كل شيء غير رقمي، وإسقاط بادئة 967 الدولية للمقارنة المحلية
function normalizePhone(phone){
  var p = String(phone || '').replace(/[^\d]/g, '');
  if (p.indexOf('967') === 0) p = p.substring(3);
  return p;
}
// تحويل رقم محلي إلى الصيغة الدولية اللازمة لروابط واتساب
function toInternational(phone){
  var p = String(phone || '').replace(/[^\d]/g, '');
  if (p.indexOf('967') === 0) return p;
  return '967' + p;
}
function generateId(){
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}
// تهريب أي نص قبل إدراجه داخل HTML، لمنع أي تعارض مع الوسوم إذا احتوى اسم على رمز خاص
function escapeHtml(str){
  return String(str == null ? '' : str)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
// تنسيق المبلغ بأرقام واضحة مع فواصل الآلاف + كلمة "ريال"
function formatMoney(n){
  var num = Number(n) || 0;
  try { return num.toLocaleString('en-US') + ' ريال'; }
  catch(e){ return num + ' ريال'; }
}
function formatDateTime(iso){
  try { return new Date(iso).toLocaleString('ar-u-nu-latn', { dateStyle:'medium', timeStyle:'short' }); }
  catch(e){ try { return new Date(iso).toLocaleString('ar-YE'); } catch(e2){ return new Date(iso).toString(); } }
}
function formatDate(iso){
  try { return new Date(iso).toLocaleDateString('ar-u-nu-latn', { dateStyle:'medium' }); }
  catch(e){ return new Date(iso).toDateString(); }
}
function formatTime(iso){
  try { return new Date(iso).toLocaleTimeString('ar-u-nu-latn', { timeStyle:'short' }); }
  catch(e){ try { return new Date(iso).toLocaleTimeString('ar-YE'); } catch(e2){ return new Date(iso).toLocaleTimeString(); } }
}

/* تخزين محلي آمن (مع معالجة أي خطأ محتمل بدل تعطل التطبيق بالكامل) */
function loadJSON(key, fallback){
  try {
    var v = localStorage.getItem(key);
    return v !== null ? JSON.parse(v) : fallback;
  } catch(e){ return fallback; }
}
function saveJSON(key, value){
  try { localStorage.setItem(key, JSON.stringify(value)); return true; }
  catch(e){ console.error('تعذّر الحفظ محلياً:', e); return false; }
}

function migrateUsers(){

  oldCollectors.forEach(function(c){
    users.push({

      phone: normalizePhone(c.phone),
      name: c.name || '',
      password: TEMP_MIGRATION_PASSWORD,
      role: 'collector',
      protected: false
    });
  });
  return users;
}
function pad2(n){ return n < 10 ? '0' + n : '' + n; }
function todayISO(){
  var d = new Date();
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
}
function firstDayOfMonthISO(){
  var d = new Date();
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-01';
}

if (state.session){
  var _freshUser = null;
  for (var _i=0; _i<state.users.length; _i++){
    if (normalizePhone(state.users[_i].phone) === normalizePhone(state.session.phone)) { _freshUser = state.users[_i]; break; }
  }

  }
}

function findTenant(id){
  for (var i=0;i<state.tenants.length;i++){ if (state.tenants[i].id === id) return state.tenants[i]; }
  return null;
}
function findUserByPhone(normalizedPhone){
  if (!normalizedPhone) return null;
  for (var i=0;i<state.users.length;i++){
    if (normalizePhone(state.users[i].phone) === normalizedPhone) return state.users[i];
  }
  return null;
}
function findUserById(id){
  for (var i=0;i<state.users.length;i++){ if (state.users[i].id === id) return state.users[i]; }
  return null;
}
function refreshSessionFromUsers(){
  if (!state.session) return;
  var u = findUserByPhone(state.session.phone);
  if (u){ state.session = { phone: u.phone, name: u.name, role: u.role }; saveJSON(KEYS.session, state.session); }
}
function isAdmin(){ return !!(state.session && state.session.role === 'admin'); }
function canSeeReports(){ return isAdmin() || !!state.permissions.collectorsSeeReports; }
function canManageRecord(r){
  if (isAdmin()) return true;
  if (!state.permissions.collectorsEditOwnRecords) return false;
  return !!(state.session && r.collectorPhone === state.session.phone);
}
function findRecordById(id){
  for (var i=0;i<state.records.length;i++){ if (state.records[i].id === id) return state.records[i]; }
  return null;
}
function getTenantMonthRecords(tenantId){
  var now = new Date();
  return state.records.filter(function(r){
    if (r.tenantId !== tenantId) return false;
    var d = new Date(r.date);
    return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
  });
}
function getUnpaidTenantsThisMonth(){
  return state.tenants.filter(function(t){ return getTenantMonthRecords(t.id).length === 0; });
}
function getRecordsInRange(fromISO, toISO){
  var from = new Date(fromISO + 'T00:00:00');
  var to = new Date(toISO + 'T23:59:59');
  return state.records.filter(function(r){
    var d = new Date(r.date);
    return d >= from && d <= to;
  }).sort(function(a,b){ return new Date(b.date) - new Date(a.date); });
}

function getFilteredTenants(query){
  var q = (query || '').trim().toLowerCase();
  if (!q) return state.tenants;
  return state.tenants.filter(function(t){
    return (t.name||'').toLowerCase().indexOf(q) !== -1 ||
           (t.shop||'').toLowerCase().indexOf(q) !== -1 ||
           (t.phone||'').indexOf(q) !== -1;
  });
}
function getTenantRecords(tenantId){
  return state.records
    .filter(function(r){ return r.tenantId === tenantId; })
    .sort(function(a,b){ return new Date(b.date) - new Date(a.date); });
}
function getTenantTotal(tenantId){
  return getTenantRecords(tenantId).reduce(function(s,r){ return s + (Number(r.amount)||0); }, 0);
}
function sumAmounts(records){ return records.reduce(function(s,r){ return s + (Number(r.amount)||0); }, 0); }
function getTodayRecords(){
  var today = new Date().toDateString();
  return state.records.filter(function(r){ return new Date(r.date).toDateString() === today; });
}
function getMonthRecords(){
  var now = new Date();
  return state.records.filter(function(r){
    var d = new Date(r.date);
    return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
  });
}

function toDatetimeLocalValue(iso){
  var d = new Date(iso);
  return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate()) + 'T' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
}

function renderCollectTab(){

}

/* ======================================================================
   أدوات مساعدة للواجهة (رسائل خطأ صغيرة + إشعار toast)
   ====================================================================== */
function showInlineError(elId, msg){
  var el = document.getElementById(elId);
  if (el){ el.textContent = msg || ''; el.style.display = msg ? 'block' : 'none'; }
}
function notify(msg){
  var el = document.getElementById('toast');
  if (!el){
    el = document.createElement('div');
    el.id = 'toast'; el.className = 'toast';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._timer);
  el._timer = setTimeout(function(){ el.classList.remove('show'); }, 2400);
}

function handleImportTenantsFile(file){
  var reader = new FileReader();
  reader.onload = function(e){
    var data;
    try { data = JSON.parse(e.target.result); } catch(err){ alert('ملف JSON غير صالح'); return; }
    if (!Array.isArray(data)){ alert('الملف ليس قائمة صحيحة'); return; }
    var added = 0, updated = 0;
    data.forEach(function(item){
      if (!item || !item.shop) return;
      var existing = null;
      for (var i=0;i<state.tenants.length;i++){ if (state.tenants[i].shop === item.shop){ existing = state.tenants[i]; break; } }
      if (existing){
        if (item.name != null) existing.name = item.name;
        if (item.phone != null) existing.phone = item.phone;
        updated++;
      } else {
        state.tenants.push({ id: generateId(), shop: item.shop, name: item.name||'', phone: item.phone||'', rent: item.rent||0 });
        added++;
      }
    });
    saveJSON(KEYS.tenants, state.tenants);
    state.showImportModal = false;
    notify('تمت إضافة ' + added + ' وتحديث ' + updated);
    render();
  };
  reader.readAsText(file);
}

function fallbackCopy(text){
  try {
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    notify('تم نسخ نص السند');
  } catch(e){ alert(text); }
}
/* آلية موحّدة وأكثر متانة لإخراج أي ملف من التطبيق (صورة سند / نسخة احتياطية / تقرير):
   1) تُجرَّب واجهة المشاركة الأصلية للجهاز أولاً — تعمل بشكل ممتاز داخل متصفح حقيقي (كروم) أو تطبيق مُنشأ عبر PWABuilder،
      وتتيح للمستخدم الحفظ في أي مكان أو الإرسال مباشرة عبر واتساب/تيليجرام/البريد.
   2) إن لم تتوفر: تنزيل مباشر عبر رابط (يعمل في المتصفح العادي، وقد لا يعمل داخل بعض تطبيقات
      "تحويل الموقع إلى تطبيق" الجاهزة التي لا تدعم هذا النوع من التنزيل).
   3) كحل أخير: فتح الملف في نافذة/تبويب جديد ليتمكن المستخدم من حفظه يدوياً من هناك. */
function shareOrDownloadBlob(blob, filename, shareTitle){
  // من واقع التجربة: تجربة المشاركة أولاً كانت تُظهر نافذة "مشاركة" غير متوقعة بدل تنزيل مباشر،
  // فإن أغلقها المستخدم ظنّاً أنها غير مرتبطة بالتنزيل، لا يحدث شيء إطلاقاً. لذلك صار الترتيب:
  // 1) تنزيل مباشر عبر رابط (هذا ما يتوقعه المستخدم، ويعمل بشكل طبيعي وموثوق في متصفح كروم الحقيقي
  //    أو تطبيق مُنشأ عبر PWABuilder — وهذا ما ستستخدمه بعد الاستضافة على GitHub Pages).
  // 2) إن فشل التنزيل المباشر لأي سبب: تُجرَّب واجهة المشاركة الأصلية للجهاز كخيار احتياطي.
  // 3) كحل أخير: فتح الملف في نافذة/تبويب جديد ليحفظه المستخدم يدوياً.
  try {
    var url = URL.createObjectURL(blob);
    var link = document.createElement('a');
    link.download = filename;
    link.href = url;
    document.body.appendChild(link); link.click(); document.body.removeChild(link);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
    notify('تم تنزيل الملف');
    return;
  } catch(e){ /* ننتقل للخيار الاحتياطي أدناه */ }

  var file = null;
  try { file = new File([blob], filename, { type: blob.type }); } catch(e){ file = null; }
  if (file && window.navigator && navigator.canShare && navigator.share){
    var canShareFile = false;
    try { canShareFile = navigator.canShare({ files: [file] }); } catch(e){ canShareFile = false; }
    if (canShareFile){
      navigator.share({ files: [file], title: shareTitle || filename })
        .then(function(){ notify('تمت المشاركة'); })
        .catch(function(){ notify('لم يكتمل الحفظ — جرّب مرة أخرى واختر "حفظ" من قائمة المشاركة'); });
      return;
    }
  }

  try {
    var url2 = URL.createObjectURL(blob);
    window.open(url2, '_blank');
    notify('تعذّر التنزيل التلقائي — تم فتح الملف في نافذة جديدة، احفظه من هناك يدوياً');
  } catch(e2){
    notify('تعذّر إخراج الملف على هذا الجهاز. جرّب فتح التطبيق من متصفح Chrome مباشرة بدل تطبيق تحويل المواقع.');
  }
}
function fallbackDataUrlDownload(dataUrl, filename){
  try {
    var link = document.createElement('a');
    link.download = filename; link.href = dataUrl;
    document.body.appendChild(link); link.click(); document.body.removeChild(link);
    notify('تم تنزيل صورة السند');
  } catch(e){ notify('تعذّر إنشاء صورة السند على هذا الجهاز'); }
}
function downloadReceiptImage(){
  var r = state.receiptRecord; if (!r) return;
  try {
    var canvas = document.createElement('canvas');
    canvas.width = 640; canvas.height = 420;
    var ctx = canvas.getContext('2d');
    ctx.direction = 'rtl';
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.strokeStyle = '#1B5FAE'; ctx.lineWidth = 6; ctx.strokeRect(3,3,canvas.width-6,canvas.height-6);
    ctx.fillStyle = '#1B5FAE';
    ctx.font = 'bold 26px Cairo, Tahoma, Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(MARKET_NAME + ' - سند تحصيل', canvas.width/2, 55);
    ctx.strokeStyle = '#E3E6EA'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(40,75); ctx.lineTo(canvas.width-40,75); ctx.stroke();
    ctx.fillStyle = '#1F2430';
    ctx.font = '20px Cairo, Tahoma, Arial, sans-serif';
    ctx.textAlign = 'right';
    var lines = [
      'المستأجر: ' + r.tenantName,
      'المحل: ' + r.shop,
      'المبلغ: ' + formatMoney(r.amount),
      'التاريخ: ' + formatDateTime(r.date),
      'المحصّل: ' + r.collectorName
    ];
    var y = 130;
    lines.forEach(function(line){ ctx.fillText(line, canvas.width-40, y); y += 46; });
    ctx.textAlign = 'center';
    ctx.fillStyle = '#6B7280';
    ctx.font = '15px Cairo, Tahoma, Arial, sans-serif';
    ctx.fillText('شكراً لتعاملكم', canvas.width/2, canvas.height-30);

    var filename = 'سند-' + r.shop + '-' + r.date.slice(0,10) + '.png';
    if (canvas.toBlob){
      canvas.toBlob(function(blob){
        if (blob) shareOrDownloadBlob(blob, filename, 'سند تحصيل - ' + MARKET_NAME);
        else fallbackDataUrlDownload(canvas.toDataURL('image/png'), filename);
      }, 'image/png');
    } else {
      fallbackDataUrlDownload(canvas.toDataURL('image/png'), filename);
    }
  } catch(e){ notify('تعذّر إنشاء صورة السند على هذا الجهاز'); }
}

function handleSaveUser(){
  var eu = state.editingUser;
  var name = (document.getElementById('user-name-input').value||'').trim();
  var phone = normalizePhone(document.getElementById('user-phone-input').value||'');
  var password = document.getElementById('user-password-input').value||'';
  var roleSelect = document.getElementById('user-role-input');
  var role = eu.protected ? 'admin' : (roleSelect ? roleSelect.value : 'collector');

  if (!name){ showInlineError('user-modal-error', 'الاسم مطلوب'); return; }
  if (!eu.protected){
    if (!phone || phone.length < 7){ showInlineError('user-modal-error', 'رقم هاتف غير صحيح'); return; }
    var dup = state.users.some(function(u){ return u.phone === phone && u.id !== eu.id; });
    if (dup){ showInlineError('user-modal-error', 'هذا الرقم مستخدم بالفعل من قبل مستخدم آخر'); return; }
  }
  if (!eu.id && !password){ showInlineError('user-modal-error', 'يرجى تحديد كلمة مرور مبدئية للمستخدم الجديد'); return; }

  if (eu.id){
    var u = findUserById(eu.id);
    if (u){
      u.name = name;
      if (!u.protected){ u.phone = phone; u.role = role; }
      if (password) u.password = password;
    }
  } else {
    state.users.push({ id: generateId(), phone: phone, name: name, password: password, role: role, protected: false });
  }
  saveJSON(KEYS.users, state.users);
  refreshSessionFromUsers();
  state.editingUser = null;
  notify('تم حفظ بيانات المستخدم');
  render();
}

function handleConfirmChangePassword(){
  var cur = document.getElementById('cp-current-input').value||'';
  var next = document.getElementById('cp-new-input').value||'';
  var confirmVal = document.getElementById('cp-confirm-input').value||'';
  var u = findUserByPhone(state.session.phone);
  if (!u){ showInlineError('cp-error', 'تعذّر العثور على الحساب'); return; }
  if (String(u.password) !== String(cur)){ showInlineError('cp-error', 'كلمة المرور الحالية غير صحيحة'); return; }
  if (!next || next.length < 4){ showInlineError('cp-error', 'كلمة المرور الجديدة يجب ألا تقل عن 4 أحرف/أرقام'); return; }
  if (next !== confirmVal){ showInlineError('cp-error', 'كلمتا المرور الجديدتان غير متطابقتين'); return; }
  u.password = next;
  saveJSON(KEYS.users, state.users);
  state.changePasswordOpen = false;
  notify('تم تغيير كلمة المرور بنجاح');
  render();
}

/* --- تعديل / حذف تحصيل مسجَّل (للمشرف فقط، مع سجل مراجعة) --- */
function openEditRecordModal(id){ var r = findRecordById(id); if (r && canManageRecord(r)) { state.editingRecord = { record: r, mode: 'edit' }; render(); } }
function openDeleteRecordModal(id){ var r = findRecordById(id); if (r && canManageRecord(r)) { state.editingRecord = { record: r, mode: 'delete' }; render(); } }
function closeRecordEditModal(){ state.editingRecord = null; render(); }
function addAuditEntry(fields){
  var entry = Object.assign({
    id: generateId(),
    at: new Date().toISOString(),
    byName: state.session ? state.session.name : '',
    byPhone: state.session ? state.session.phone : ''
  }, fields);
  state.auditLog.push(entry);
  saveJSON(KEYS.auditLog, state.auditLog);
}
function handleConfirmEditRecord(){
  var ctx = state.editingRecord; if (!ctx) return;
  var ref = ctx.record;
  var amountInput = document.getElementById('record-edit-amount');
  var dateInput = document.getElementById('record-edit-date');
  var reasonInput = document.getElementById('record-edit-reason');
  var newAmount = amountInput ? parseFloat(amountInput.value) : NaN;
  var newDateLocal = dateInput ? dateInput.value : '';
  var reason = reasonInput ? reasonInput.value.trim() : '';
  if (!newAmount || newAmount <= 0){ showInlineError('record-edit-error', 'يرجى إدخال مبلغ صحيح أكبر من صفر'); return; }
  if (!newDateLocal){ showInlineError('record-edit-error', 'يرجى تحديد التاريخ والوقت'); return; }
  if (!reason){ showInlineError('record-edit-error', 'يرجى كتابة سبب التعديل'); return; }
  var newDate = new Date(newDateLocal).toISOString();

  var live = findRecordById(ref.id); if (!live) return;
  var oldAmount = live.amount, oldDate = live.date;
  live.amount = newAmount;
  live.date = newDate;
  saveJSON(KEYS.records, state.records);

  addAuditEntry({ action:'edit', recordId: ref.id, tenantName: ref.tenantName, shop: ref.shop, oldAmount: oldAmount, newAmount: newAmount, oldDate: oldDate, newDate: newDate, reason: reason });

  state.editingRecord = null;
  notify('تم حفظ تعديل التحصيل');
  render();
}
function handleConfirmDeleteRecord(){
  var ctx = state.editingRecord; if (!ctx) return;
  var ref = ctx.record;
  var reasonInput = document.getElementById('record-edit-reason');
  var reason = reasonInput ? reasonInput.value.trim() : '';
  if (!reason){ showInlineError('record-edit-error', 'يرجى كتابة سبب الحذف'); return; }

  state.records = state.records.filter(function(x){ return x.id !== ref.id; });
  saveJSON(KEYS.records, state.records);

  addAuditEntry({ action:'delete', recordId: ref.id, tenantName: ref.tenantName, shop: ref.shop, oldAmount: ref.amount, oldDate: ref.date, reason: reason });

  state.editingRecord = null;
  notify('تم حذف التحصيل');
  render();
}

/* --- التنبيهات --- */
function sendReminder(id){
  var t = findTenant(id); if (!t || !t.phone) return;
  var msg = 'تذكير من ' + MARKET_NAME + '\nعزيزي ' + t.name + '،\nنود تذكيركم بأن إيجار المحل رقم ' + t.shop + ' لم يُسجَّل بعد لهذا الشهر. نرجو التكرم بالتواصل مع إدارة السوق لتسديده في أقرب وقت.\nشكراً لتعاونكم.';
  sendWhatsApp(t.phone, msg);
}

/* --- التقارير --- */
function applyReportRange(){
  var fromInput = document.getElementById('report-from-input');
  var toInput = document.getElementById('report-to-input');
  state.reportRange = {
    from: fromInput ? fromInput.value : state.reportRange.from,
    to: toInput ? toInput.value : state.reportRange.to
  };
  render();
}
function exportReportPdf(){ window.print(); }
function csvCell(v){
  var s = String(v == null ? '' : v);
  if (/[",\r\n]/.test(s)) s = '"' + s.replace(/"/g,'""') + '"';
  return s;
}
function exportReportExcel(){
  var records = getRecordsInRange(state.reportRange.from, state.reportRange.to);
  var q = (state.reportSearch||'').trim().toLowerCase();
  if (q){
    records = records.filter(function(r){
      return (r.tenantName||'').toLowerCase().indexOf(q) !== -1 || (r.shop||'').toLowerCase().indexOf(q) !== -1;
    });
  }
  var header = ['التاريخ','الوقت','المستأجر','المحل','المبلغ','المحصّل'];
  var rows = [header];
  records.forEach(function(r){
    rows.push([formatDate(r.date), formatTime(r.date), r.tenantName, r.shop, r.amount, r.collectorName||'']);
  });
  var csv = rows.map(function(row){ return row.map(csvCell).join(','); }).join('\r\n');
  var blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  shareOrDownloadBlob(blob, 'تقرير-تحصيل-' + state.reportRange.from + '-الى-' + state.reportRange.to + '.csv', 'تقرير تحصيل ' + MARKET_NAME);
}

function exportBackup(){
  var backup = {
    type: 'souq48-backup', version: 2, exportedAt: new Date().toISOString(),
    tenants: state.tenants, records: state.records,
    mgmtNumber: state.mgmtNumber, users: state.users, auditLog: state.auditLog
  };
  try {
    var blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
    shareOrDownloadBlob(blob, 'souq48-backup-' + new Date().toISOString().slice(0,10) + '.json', 'نسخة احتياطية - ' + MARKET_NAME);
  } catch(e){ notify('تعذّر إنشاء النسخة الاحتياطية على هذا الجهاز'); }
}
function handleRestoreFile(file){
  var reader = new FileReader();
  reader.onload = function(e){
    var data;
    try { data = JSON.parse(e.target.result); } catch(err){ alert('تعذّرت قراءة الملف. تأكد أنه ملف نسخة احتياطية صحيح.'); return; }
    if (!data || !Array.isArray(data.tenants) || !Array.isArray(data.records)){ alert('ملف النسخة الاحتياطية غير صالح'); return; }
    if (!confirm('سيتم استبدال جميع البيانات الحالية ببيانات هذه النسخة الاحتياطية. هل أنت متأكد؟')) return;
    state.tenants = data.tenants;
    state.records = data.records;
    if (data.mgmtNumber) state.mgmtNumber = data.mgmtNumber;
    if (Array.isArray(data.users) && data.users.length){
      state.users = data.users;
    } else if (data.adminName || Array.isArray(data.collectors)){
      // نسخة احتياطية من إصدار سابق (بدون كلمات مرور) — تُحوَّل تلقائياً للنظام الجديد بكلمة مرور مؤقتة
      var legacyUsers = [{ id:'root-admin', phone: normalizePhone(ADMIN_PHONE), name: data.adminName || DEFAULT_ADMIN_NAME, password: TEMP_MIGRATION_PASSWORD, role:'admin', protected:true }];
      (data.collectors||[]).forEach(function(c){
        legacyUsers.push({ id: generateId(), phone: normalizePhone(c.phone), name: c.name||'', password: TEMP_MIGRATION_PASSWORD, role:'collector', protected:false });
      });
      state.users = legacyUsers;
    }
    if (Array.isArray(data.auditLog)) state.auditLog = data.auditLog;
    saveJSON(KEYS.tenants, state.tenants);
    saveJSON(KEYS.records, state.records);
    saveJSON(KEYS.mgmt, state.mgmtNumber);
    saveJSON(KEYS.users, state.users);
    saveJSON(KEYS.auditLog, state.auditLog);
    refreshSessionFromUsers();
    notify('تم استرجاع النسخة الاحتياطية بنجاح');
    render();
  };
  reader.readAsText(file);
}

function openEraseModal(){ state.eraseModal = true; render(); }
function closeEraseModal(){ state.eraseModal = false; render(); }
function handleConfirmErase(){
  var input = document.getElementById('erase-confirm-input');
  var val = input ? input.value.trim() : '';
  if (val !== 'حذف'){ showInlineError('erase-error', 'اكتب كلمة «حذف» بالضبط للتأكيد'); return; }
  exportBackup();
  state.tenants = [];
  state.records = [];
  saveJSON(KEYS.tenants, state.tenants);
  saveJSON(KEYS.records, state.records);
  state.eraseModal = false;
  notify('تم مسح البيانات، وتم تنزيل نسخة احتياطية قبل الحذف');
  render();
}

/* ======================================================================
   ربط الأحداث (تفويض واحد على مستوى الجذر — يعمل دائماً حتى بعد إعادة رسم المحتوى)
   ====================================================================== */
function handleGlobalClick(e){
  var el = e.target.closest('[data-action]');
  if (!el) return;
  var action = el.dataset.action;
  var id = el.dataset.id;
  switch(action){
    case 'switch-tab': setActiveTab(el.dataset.tab); break;
    case 'logout': handleLogout(); break;

    case 'open-add-tenant': openTenantModal({}); break;
    case 'open-edit-tenant': openTenantModal(Object.assign({}, findTenant(id))); break;
    case 'open-replace-tenant': openReplaceTenantModal(findTenant(id)); break;
    case 'delete-tenant': handleDeleteTenant(id); break;
    case 'close-tenant-modal': closeTenantModal(); break;
    case 'save-tenant': handleSaveTenant(); break;

    case 'open-import': openImportModal(); break;
    case 'close-import': closeImportModal(); break;
    case 'trigger-import-file': document.getElementById('import-json-input').click(); break;

    case 'open-history': openHistoryModal(id); break;
    case 'close-history': closeHistoryModal(); break;

    case 'pick-tenant': pickTenantForCollection(id); break;
    case 'change-selected-tenant': changeSelectedTenant(); break;
    case 'save-collection': handleSaveCollection(); break;
    case 'close-receipt': closeReceiptModal(); break;
    case 'send-tenant-whatsapp': sendReceiptToTenant(); break;
    case 'send-admin-whatsapp': sendReceiptToAdmin(); break;
    case 'copy-receipt': copyReceiptText(); break;
    case 'download-receipt': downloadReceiptImage(); break;

    case 'save-mgmt': handleSaveMgmt(); break;
    case 'save-permissions': handleSavePermissions(); break;
    case 'export-backup': exportBackup(); break;
    case 'trigger-restore-file': document.getElementById('restore-file-input').click(); break;
    case 'open-erase-confirm': openEraseModal(); break;
    case 'close-erase-confirm': closeEraseModal(); break;
    case 'confirm-erase': handleConfirmErase(); break;

    case 'open-add-user': openAddUserModal(); break;
    case 'open-edit-user': openEditUserModal(id); break;
    case 'close-user-modal': closeUserModal(); break;
    case 'save-user': handleSaveUser(); break;
    case 'delete-user': handleDeleteUser(id); break;
    case 'open-change-password': openChangePasswordModal(); break;
    case 'close-change-password': closeChangePasswordModal(); break;
    case 'confirm-change-password': handleConfirmChangePassword(); break;

    case 'open-edit-record': openEditRecordModal(id); break;
    case 'open-delete-record': openDeleteRecordModal(id); break;
    case 'close-record-edit': closeRecordEditModal(); break;
    case 'confirm-edit-record': handleConfirmEditRecord(); break;
    case 'confirm-delete-record': handleConfirmDeleteRecord(); break;

    case 'send-reminder': sendReminder(id); break;

    case 'apply-report-range': applyReportRange(); break;
    case 'export-report-pdf': exportReportPdf(); break;
    case 'export-report-excel': exportReportExcel(); break;
  }
}

function handleGlobalSubmit(e){
  if (e.target && e.target.id === 'login-form'){
    e.preventDefault();
    handleLoginSubmit();
  }
}

function handleGlobalInput(e){
  if (e.target.id === 'tenant-search-input'){
    state.tenantSearch = e.target.value;
    var c1 = document.getElementById('tenant-list-items');
    if (c1) c1.innerHTML = renderTenantListItems(getFilteredTenants(state.tenantSearch));
  } else if (e.target.id === 'collect-search-input'){
    state.collectSearch = e.target.value;
    var c2 = document.getElementById('collect-suggestions');
    if (c2) c2.innerHTML = renderCollectSuggestions(state.collectSearch);
  } else if (e.target.id === 'report-search-input'){
    state.reportSearch = e.target.value;
    var c3 = document.getElementById('report-print-area');
    if (c3) c3.innerHTML = renderReportRecordsList();
  }
}

function handleGlobalKeydown(e){
  if (e.key === 'Enter' && e.target && e.target.id === 'collect-amount-input'){
    e.preventDefault();
    handleSaveCollection();
  }
}

function handleGlobalChange(e){
  if (e.target.id === 'restore-file-input' && e.target.files[0]) handleRestoreFile(e.target.files[0]);
  if (e.target.id === 'import-json-input' && e.target.files[0]) handleImportTenantsFile(e.target.files[0]);
}

/* ======================================================================
   بدء التشغيل
   ====================================================================== */
function init(){
  var appRoot = document.getElementById('app');
  appRoot.addEventListener('click', handleGlobalClick);
  appRoot.addEventListener('submit', handleGlobalSubmit);
  appRoot.addEventListener('input', handleGlobalInput);
  appRoot.addEventListener('keydown', handleGlobalKeydown);
  document.body.addEventListener('change', handleGlobalChange);
  render();

  // تسجيل الخدمة العاملة في الخلفية (Service Worker) لتفعيل العمل بدون إنترنت والتثبيت كتطبيق
  // هذا اختياري تماماً: إن فشل (مثلاً عند فتح الملف مباشرة بدون استضافة) يستمر التطبيق بالعمل بشكل طبيعي
  if ('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('./sw.js').catch(function(){ /* تجاهل بصمت */ });
    });
  }
}

if (document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}

})();
</script>
